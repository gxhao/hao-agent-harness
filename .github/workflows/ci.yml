name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: false
      - name: Format
        run: test -z "$(gofmt -l cmd internal tests)"
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race -timeout 60s -coverprofile=coverage.out ./...
      - name: Build
        run: go build -trimpath -o bin/server ./cmd/server
