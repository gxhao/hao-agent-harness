# 此文件是唯一的应用配置中心。虽保留 .json 路径以兼容现有部署，内容必须使用 YAML。
# 修改后约 1 秒内自动校验并热加载；无效配置会保留上一份有效配置。
server:
  http_addr: 127.0.0.1:8090
  metrics_addr: 127.0.0.1:9090
  max_request_bytes: 1048576
  max_concurrent_requests: 64
  request_timeout: 120s
  upstream_header_timeout: 30s
  stream_first_event_timeout: 30s
  stream_idle_timeout: 30s
  downstream_write_timeout: 15s
  shutdown_timeout: 30s

logging:
  level: info
  chat_log_dir: logs/requests

providers:
  openai:
    auth_type: openai_codex
    codex_token_file: credentials/openai-codex.json
    # API Key provider 示例（不要把真实密钥提交到版本库）：
    # auth_type: api_key
    # chat_url: https://api.example.com/v1/chat/completions
    # api_key: replace-with-your-provider-key

models:
  default:
    provider: openai
    upstream_model: gpt-6-luna
    supports_stream: true
    supports_temperature: false
    supports_max_tokens: false
